<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/dashboard_ss

    <Directory /var/www/dashboard_ss>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/dashboard_ss_error.log
    CustomLog ${APACHE_LOG_DIR}/dashboard_ss_access.log combined
</VirtualHost>
